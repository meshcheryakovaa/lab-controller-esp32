; =============================================================================
;  Universal ESP32 Laboratory Controller — firmware build configuration
; =============================================================================
;  Environments
;    esp32dev   — main target (ESP32 DevKit / WROOM-32)
;    esp32s3    — forward-compatibility target (ESP32-S3, PSRAM)
;    native     — host build of the platform-independent core, for unit tests
;                 (`pio test -e native`). Contains NO Arduino code.
; =============================================================================

[platformio]
default_envs = esp32dev
src_dir      = src
include_dir  = include
test_dir     = test
data_dir     = data

; ---------------------------------------------------------------------------
;  Shared settings for every embedded target
; ---------------------------------------------------------------------------
[env]
framework       = arduino
build_unflags   = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -I src
    -D LC_FIRMWARE_VERSION=\"0.15.1-m15\"
    -D LC_CONFIG_SCHEMA_VERSION=1
    -D ARDUINOJSON_ENABLE_STD_STRING=1
    -D CORE_DEBUG_LEVEL=3
; PINNED, not ranged.  Milestone 12 began with a build that had worked for
; eleven milestones failing to compile, because `^7.2.0` had quietly resolved to
; ArduinoJson 7.4.3 — which deleted an enumerator the code used — and `^2.0.0`
; to PsychicHttp 2.2.0, whose request handlers take two arguments instead of
; one.  Both libraries were entitled to make those changes; the caret was the
; mistake.  A firmware release names the versions it was tested against, and
; tools/esp32_typecheck/check.sh compiles against exactly these.
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
    hoeken/PsychicHttp @ 2.2.0
    pololu/VL53L0X @ 1.3.1
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
check_tool      = cppcheck
check_flags     = --enable=warning,style --inline-suppr
extra_scripts   = pre:../tools/build_frontend.py
; The POSIX storage backend exists only for the host test build.
build_src_filter =
    +<*>
    -<storage/PosixBackend.cpp>
    -<platform/host/>

; ---------------------------------------------------------------------------
;  ESP32 DevKit — primary development board
; ---------------------------------------------------------------------------
[env:esp32dev]
platform       = espressif32 @ ^6.9.0
board          = esp32dev
board_build.filesystem   = littlefs
board_build.partitions   = partitions_4mb.csv
build_flags =
    ${env.build_flags}
    -D LC_TARGET_ESP32=1
    -D LC_HAS_PSRAM=0

; ---------------------------------------------------------------------------
;  ESP32 DevKit, diagnostic build.
;
;  For the next time a panic has to be read rather than guessed at.  The 0.15.1
;  investigation started from this:
;
;      Backtrace: 0xfffffffe:0x8008e498 |<-CORRUPTED
;
;  which is all a release build can say once the return address has been
;  overwritten.  Here, esp32_exception_decoder turns addresses into file and
;  line, -Og keeps the frames intact, and CORE_DEBUG_LEVEL=5 gets the Wi-Fi and
;  LittleFS chatter that surrounds the fault into the same log.
;
;      pio run -e esp32dev-debug -t upload
;      pio device monitor -e esp32dev-debug
;
;  Keep .pio/build/esp32dev-debug/firmware.elf from the build that produced the
;  panic: rebuilding moves every address and the decode becomes fiction.
;
;  LC_MEM_DIAGNOSTICS turns on the heap and stack reporting around segment
;  rotation and ACK, and a full heap integrity check at each of those points.
;  It is deliberately not on in the release build — it is expensive, and it is
;  a net to catch a fault, not something to run an experiment through.
; ---------------------------------------------------------------------------
[env:esp32dev-debug]
extends        = env:esp32dev
build_type     = debug
build_flags =
    ${env:esp32dev.build_flags}
    -Og
    -ggdb3
    -D CORE_DEBUG_LEVEL=5
    -D LC_MEM_DIAGNOSTICS=1
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
;  ESP32-S3 — future target, PSRAM enabled
; ---------------------------------------------------------------------------
[env:esp32s3]
platform       = espressif32 @ ^6.9.0
board          = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = partitions_8mb.csv
build_flags =
    ${env.build_flags}
    -D LC_TARGET_ESP32S3=1
    -D LC_HAS_PSRAM=1
    -D BOARD_HAS_PSRAM

; ---------------------------------------------------------------------------
;  Host build — unit tests for the platform-independent core
;  Only src/core, src/services and src/platform/host are compiled here.
; ---------------------------------------------------------------------------
[env:native]
platform      = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -I src
    -D LC_TARGET_HOST=1
    -D LC_FIRMWARE_VERSION=\"0.15.1-m15\"
    -D LC_CONFIG_SCHEMA_VERSION=1
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_src_filter =
    +<core/*>
    +<api/*>
    +<buses/*>
    +<services/*>
    +<storage/*>
    +<app/*>
    +<platform/host/*>
    +<modules/BuiltinModules.cpp>
    +<modules/processing/*>
    +<modules/sensors/*>   ; every sensor driver is Arduino-free by design
    +<modules/virtual/*>
    -<storage/LittleFsBackend.cpp>
    -<buses/esp32/>
    -<api/esp32/>
test_framework = unity
extra_scripts  =
